[metadata]
name = seu-pulse
version = 0.1.0
description = Public SEU notices: collection, persistence and queries

[options]
packages = find:
python_requires = >=3.10
install_requires =
    tomli>=1.0.3; python_version < "3.11"

[options.packages.find]
include = seu_pulse*

[options.extras_require]
browser =
    crawl4ai>=0.7,<1

[options.entry_points]
console_scripts =
    seu-pulse = seu_pulse.cli:main
